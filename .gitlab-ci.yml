# Builds the self-contained Artemis.exe on every push and publishes it as a
# downloadable job artifact. Runs on a standard Linux runner -- cross-compiling a
# self-contained win-x64 single-file exe from Linux is fully supported.

stages:
  - build

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

build:windows-exe:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  cache:
    key:
      files:
        - Artemis.csproj
    paths:
      - .nuget/packages
  script:
    - dotnet publish -p:PublishProfile=SelfContained
    - ls -lh publish/win-x64/
  artifacts:
    name: "Artemis-$CI_COMMIT_SHORT_SHA"
    paths:
      - publish/win-x64/Artemis.exe
    expire_in: 30 days
